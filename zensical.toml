[theme]
name = "modern"

[project]
title = "Projeto CTT AP2 Collabtech"
description = "Documentação do projeto"
site_name = "Projeto Collabtech"

[extra.theme]
name = "material"
language = "pt-BR"
logo = "https://go.dev/blog/go-brand/Go-Logo/PNG/Go-Logo_Aqua.png"
favicon = "https://go.dev/favicon.ico"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "toc.integrate",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link"
]

[[extra.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "material/weather-night"
toggle.name = "Modo escuro"

[[extra.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "material/weather-sunny"
toggle.name = "Modo claro"

[extra.theme.font]
text = "Inter"
code = "JetBrains Mono"

[plugins.search]
lang = "pt"

[extra]
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["https://unpkg.com/mermaid@10/dist/mermaid.min.js"]

[markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.inlinehilite" = {}
attr_list = {}
md_in_html = {}
tables = {}

[markdown_extensions."pymdownx.superfences"]
[[markdown_extensions."pymdownx.superfences".custom_fences]]
name = "mermaid"
class = "mermaid"
format = "!!python/name:pymdownx.superfences.fence_code_format"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
use_pygments = true

[markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[markdown_extensions."pymdownx.emoji"]
emoji_index = "!!python/name:material.extensions.emoji.twemoji"
emoji_generator = "!!python/name:material.extensions.emoji.to_svg"

[markdown_extensions.toc]
permalink = true

