site_name: Documentação Go
site_description: Documentação completa da linguagem Go em português.
site_url: https://impacta-gb.github.io/projeto-ctt-ap2-collabtech/

theme:
  name: material
  language: pt-BR
  logo: https://go.dev/blog/go-brand/Go-Logo/PNG/Go-Logo_Aqua.png
  favicon: https://go.dev/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search:
      lang: pt

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - 🏠 Início: index.md
  - Fundamentos:
    - 🚀 Introdução e Instalação: introducao-e-instalacao.md
    - 📝 Sintaxe Básica e Variáveis: sintaxe-basica-e-variaveis.md
    - 🔀 Estruturas de Controle: estruturas-de-controle.md
  - Estruturas de Dados:
    - 📦 Arrays, Slices e Maps: arrays-slices-e-maps.md
    - 🏗️ Structs e Métodos: structs-e-metodos.md
  - Avançado:
    - ⚠️ Tratamento de Erros: tratamento-de-erros.md
    - ⚡ Goroutines: concorrencia-goroutines.md
    - 🔗 Channels: concorrencia-channels.md
    - 📦 Gerenciamento de Pacotes: gerenciamento-de-pacotes.md
    - ✅ Testes Automatizados: testes-automatizados.md
