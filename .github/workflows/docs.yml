name: Documentation

on:
  push:
    branches:
      - main # Executa após o merge de um PR na main
  pull_request:
    branches:
      - main # Executa durante o PR para validação de erros
  schedule:
    - cron: '0 0 * * 0' # Executa de forma agendada uma vez por semana
  workflow_dispatch: # Permite execução manual pela equipe para testes

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Resiliência: impede que a falha de uma versão cancele a outra
      matrix:
        python-version: ["3.10", "3.11"] # Matriz multi-ambiente exigida

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4 # Otimização de performance
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install zensical

      - name: Build documentation
        run: |
          # Gera o site estático através do Zensical
          zensical build --clean

      # Upload do Artefato: Isolado no build e restrito à versão estável (3.11)
      - name: Upload Pages Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy_site:
    # Condicional de Segurança estrita: NUNCA executa em Pull Request
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    needs: build_site # Desacoplamento de Jobs: aguarda a validação do build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Faz o download e publica o artefato
