name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Executa automaticamente uma vez por semana (toda segunda-feira às 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1: Validação e Construção do Site (Roda em PRs e Pushes)
  build_site:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"] # Matriz de testes obrigatória
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v6

      - name: Configurar Python ${{ matrix.python-version }} com Cache
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Implementação nativa e otimizada de cache do pip

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Executar Build do Zensical
        run: zensical build --clean

      # Upload do artefato gerado. Para evitar duplicidade na matriz,
      # fazemos o upload apenas a partir de uma das versões consolidadas (ex: 3.11).
      - name: Empacotar Artefato do Site
        if: matrix.python-version == '3.11'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # JOB 2: Publicação no GitHub Pages (Bloqueado em PRs)
  deploy_site:
    needs: build_site # Garante o fluxo de dependência entre jobs
    if: github.event_name != 'pull_request' # Condicional de segurança estrita
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # Baixa o artefato e faz o deploy automaticamente
